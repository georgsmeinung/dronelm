<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="Inter, 'Segoe UI', sans-serif">
  <!-- A9: LeWorldModel frente al VLM de la tesis -->

  <style>
    .bg { fill: #FFFFFF; }
    .panel { fill: #F6F8FA; stroke: #E2E8F0; stroke-width: 1.2; }
    .card { fill: #FFFFFF; stroke: #CBD5E0; stroke-width: 1.4; }
    .card-acc { fill: #FFFFFF; stroke: #0066CC; stroke-width: 1.8; }
    .card-blue { fill: #E6F2FF; stroke: #0066CC; stroke-width: 1.8; }
    .card-green { fill: #EAF7EF; stroke: #259E5F; stroke-width: 1.8; }
    .card-warn { fill: #FFF7E6; stroke: #D97706; stroke-width: 1.8; }
    .card-red { fill: #FDECEC; stroke: #DC2626; stroke-width: 1.8; }
    .card-gray { fill: #F1F3F5; stroke: #A0AEC0; stroke-width: 1.4; stroke-dasharray: 6 4; }
    .head { font-size: 14px; font-weight: 800; letter-spacing: .05em; fill: #0066CC; }
    .head-ink { font-size: 14px; font-weight: 800; letter-spacing: .05em; fill: #2D3748; }
    .title { font-size: 22px; font-weight: 800; fill: #1A202C; }
    .ttl { font-size: 15px; font-weight: 700; fill: #1A202C; }
    .txt { font-size: 13px; fill: #4A5568; }
    .txt-b { font-size: 13px; font-weight: 700; fill: #2D3748; }
    .small { font-size: 11.5px; fill: #718096; }
    .mono { font-family: 'Noto Sans Mono', ui-monospace, monospace; font-size: 12px; fill: #1A202C; }
    .mono-s { font-family: 'Noto Sans Mono', ui-monospace, monospace; font-size: 11px; fill: #4A5568; }
    .math { font-family: 'Cambria Math', 'STIX Two Math', 'Times New Roman', serif; font-size: 17px; fill: #1A202C; }
    .math-s { font-family: 'Cambria Math', 'STIX Two Math', 'Times New Roman', serif; font-size: 14px; fill: #1A202C; }
    .acc { fill: #0066CC; } .safe { fill: #259E5F; } .warn { fill: #B45309; } .crit { fill: #DC2626; }
    .ln { stroke: #4A5568; stroke-width: 1.8; fill: none; }
    .ln-acc { stroke: #0066CC; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #718096; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
    .grid { stroke: #2D3748; stroke-width: 1.2; fill: none; }
    .badge { fill: #0066CC; } .badge-t { font-size: 13px; font-weight: 800; fill: #FFFFFF; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="8" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#4A5568" /></marker>
    <marker id="aa" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="8" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#0066CC" /></marker>
    <marker id="av" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#0066CC" /></marker>
    <marker id="ag" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#718096" /></marker>
    <marker id="ar" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#DC2626" /></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="660" />
  <text class="head" x="24" y="36" text-anchor="start" >MODELO DE MUNDO LATENTE (LeWM) FRENTE AL VLM DE LA TESIS</text>
  <text class="small" x="24" y="56" text-anchor="start" >Anexo 9 · nada está implementado ni medido: [P] dato del paper (Maes et al., 2026); [E] estimación; [T] dato de la tesis</text>
  <rect class="panel" x="24" y="76" width="1152" height="236" rx="10" />
  <text class="head-ink" x="44" y="104" text-anchor="start" >LeWM: PREDECIR EN EL ESPACIO LATENTE Y PLANIFICAR CON CEM [P]</text>
  <rect class="card" x="44" y="124" width="200" height="110" rx="8" />
  <text class="ttl" x="58" y="148" text-anchor="start" >Fotograma RGB</text>
  <text class="txt" x="58" y="170" text-anchor="start" >224 × 224</text>
  <path class="ln" d="M246 179 L270 179" marker-end="url(#ah)" />
  <rect class="card-blue" x="272" y="124" width="230" height="110" rx="8" />
  <text class="ttl" x="286" y="148" text-anchor="start" >Codificador ViT-Tiny</text>
  <text class="txt" x="286" y="170" text-anchor="start" >~5 M parámetros</text>
  <text class="txt" x="286" y="188" text-anchor="start" >embedding z (192)</text>
  <path class="ln" d="M504 179 L528 179" marker-end="url(#ah)" />
  <rect class="card-blue" x="530" y="124" width="270" height="110" rx="8" />
  <text class="ttl" x="544" y="148" text-anchor="start" >Predictor transformer</text>
  <text class="txt" x="544" y="170" text-anchor="start" >6 capas, ~10 M parámetros</text>
  <text class="txt" x="544" y="188" text-anchor="start" >z<tspan baseline-shift="sub" font-size="72%">t+1</tspan> a partir de z<tspan baseline-shift="sub" font-size="72%">t</tspan> y la</text>
  <text class="txt" x="544" y="206" text-anchor="start" >acción (inyectada por AdaLN)</text>
  <path class="ln" d="M802 179 L826 179" marker-end="url(#ah)" />
  <rect class="card-green" x="828" y="124" width="328" height="110" rx="8" />
  <text class="ttl" x="842" y="148" text-anchor="start" >Planificación por CEM</text>
  <text class="txt" x="842" y="170" text-anchor="start" >300 secuencias, 10–30 iteraciones,</text>
  <text class="txt" x="842" y="188" text-anchor="start" >horizonte H = 5; costo ‖z<tspan baseline-shift="sub" font-size="72%">H</tspan> − z<tspan baseline-shift="sub" font-size="72%">g</tspan>‖²</text>
  <text class="txt" x="842" y="206" text-anchor="start" >con z<tspan baseline-shift="sub" font-size="72%">g</tspan> el embedding de la meta</text>
  <text class="txt" x="600" y="268" text-anchor="middle" >~15 M parámetros en total · evaluado en Push-T, Reacher, OGBench-Cube y Two-Room: sin validación en visión aérea urbana</text>
  <text class="small" x="600" y="292" text-anchor="middle" >la meta es una imagen; la misión del dron se define por waypoints: habría que adaptar el objetivo</text>
  <rect class="panel" x="24" y="332" width="640" height="304" rx="10" />
  <text class="head-ink" x="44" y="360" text-anchor="start" >COMPARACIÓN</text>
  <text class="txt-b" x="44" y="392" text-anchor="start" ></text>
  <text class="txt-b" x="200" y="392" text-anchor="start" >VLM de la tesis</text>
  <text class="txt-b" x="450" y="392" text-anchor="start" >LeWM</text>
  <line x1="44" y1="402" x2="644" y2="402" stroke="#CBD5E0" stroke-width="1" />
  <text class="txt-b" x="44" y="426" text-anchor="start" >Modelo</text>
  <text class="txt" x="200" y="426" text-anchor="start" >LFM2.5-VL-1.6B [T]</text>
  <text class="txt" x="450" y="426" text-anchor="start" >JEPA, ~15 M [P]</text>
  <text class="txt-b" x="44" y="460" text-anchor="start" >Memoria</text>
  <text class="txt" x="200" y="460" text-anchor="start" >~1.6 GB, Q4_K_M [T]</text>
  <text class="txt" x="450" y="460" text-anchor="start" >~30 MB en FP16 [E]</text>
  <text class="txt-b" x="44" y="494" text-anchor="start" >Función</text>
  <text class="txt" x="200" y="494" text-anchor="start" >describe qué está libre</text>
  <text class="txt" x="450" y="494" text-anchor="start" >predice consecuencias</text>
  <text class="txt-b" x="44" y="528" text-anchor="start" >Salida</text>
  <text class="txt" x="200" y="528" text-anchor="start" >enumeración JSON</text>
  <text class="txt" x="450" y="528" text-anchor="start" >secuencia de acciones</text>
  <text class="txt-b" x="44" y="562" text-anchor="start" >Rol hoy</text>
  <text class="txt" x="200" y="562" text-anchor="start" >plan de ruta antes del vuelo</text>
  <text class="txt" x="450" y="562" text-anchor="start" >ninguno (propuesta)</text>
  <text class="txt-b" x="44" y="596" text-anchor="start" >Interpretable</text>
  <text class="txt" x="200" y="596" text-anchor="start" >respuesta auditable</text>
  <text class="txt" x="450" y="596" text-anchor="start" >latente, por sondas</text>
  <rect class="panel" x="684" y="332" width="492" height="304" rx="10" />
  <text class="head-ink" x="704" y="360" text-anchor="start" >OPCIONES DE INTEGRACIÓN (IT.A9.4)</text>
  <rect class="card-red" x="704" y="376" width="452" height="72" rx="8" />
  <text class="ttl" x="720" y="400" text-anchor="start" >A · Reemplazar al VLM</text>
  <text class="txt" x="720" y="422" text-anchor="start" >no recomendada: pierde la semántica y</text>
  <text class="txt" x="720" y="440" text-anchor="start" >exige definir la meta como imagen</text>
  <rect class="card-green" x="704" y="460" width="452" height="72" rx="8" />
  <text class="ttl" x="720" y="484" text-anchor="start" >B · Verificador de consecuencias</text>
  <text class="txt" x="720" y="506" text-anchor="start" >recomendada como primer paso: predice el</text>
  <text class="txt" x="720" y="524" text-anchor="start" >efecto de la acción y detecta sorpresas</text>
  <rect class="card-blue" x="704" y="544" width="452" height="72" rx="8" />
  <text class="ttl" x="720" y="568" text-anchor="start" >C · Simulador latente para rl</text>
  <text class="txt" x="720" y="590" text-anchor="start" >complementaria con el Anexo 8: entrenar</text>
  <text class="txt" x="720" y="608" text-anchor="start" >la política del brazo rl «en imaginación»</text>
</svg>
