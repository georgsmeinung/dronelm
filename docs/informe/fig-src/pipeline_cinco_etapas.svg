<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1276 290" width="1276" height="290" font-family="Inter, 'Segoe UI', sans-serif">
  <!-- Pipeline de percepcion en cinco etapas (FlowTTCEstimator.estimate). Fuente de informe/2026-1113 pipeline_cinco_etapas.png (cap. 6, IT.6.2) -->
  <style>
    .bg    { fill: #FFFFFF; }
    .frame { fill: #F6F8FA; stroke: #E2E8F0; stroke-width: 1.2; }
    .card  { fill: #FFFFFF; stroke: #0066CC; stroke-width: 1.6; }
    .io    { fill: #FFFFFF; stroke: #4A5568; stroke-width: 1.6; }
    .out   { fill: #E6F2FF; stroke: #0066CC; stroke-width: 2.2; }
    .none  { fill: #FFFFFF; stroke: #A0AEC0; stroke-width: 1.4; stroke-dasharray: 6 4; }
    .head  { font-size: 13px; font-weight: 800; letter-spacing: .06em; fill: #0066CC; }
    .hsub  { font-family: 'Noto Sans Mono', ui-monospace, monospace; font-size: 11.5px; fill: #718096; }
    .ttl   { font-size: 13.5px; font-weight: 700; fill: #1A202C; }
    .txt   { font-size: 12px; fill: #4A5568; }
    .mono  { font-family: 'Noto Sans Mono', ui-monospace, monospace; font-size: 12px; fill: #1A202C; }
    .monoB { font-family: 'Noto Sans Mono', ui-monospace, monospace; font-size: 13.5px; font-weight: 700; fill: #0066CC; }
    .lab   { font-size: 11px; font-weight: 700; letter-spacing: .05em; fill: #718096; }
    .gray  { font-size: 12px; fill: #718096; }
    .badge { fill: #0066CC; } .badge-t { font-size: 12px; font-weight: 800; fill: #FFFFFF; }
    .arrow { fill: none; stroke: #4A5568; stroke-width: 2; }
    .drop  { fill: none; stroke: #A0AEC0; stroke-width: 1.4; stroke-dasharray: 4 4; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="8" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#4A5568" />
    </marker>
    <marker id="ahG" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#A0AEC0" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1276" height="290" />
  <rect class="frame" x="8" y="8" width="1260" height="274" rx="10" />

  <text class="head" x="24" y="38">LAZO RÁPIDO · PERCEPCIÓN POR FLUJO ÓPTICO</text>
  <text class="hsub" x="24" y="58">FlowTTCEstimator.estimate() · una vez por ciclo de 200 ms</text>

  <!-- entrada -->
  <rect class="io" x="20" y="80" width="150" height="96" rx="8" />
  <text class="lab" x="36" y="104">ENTRADA</text>
  <text class="mono" x="36" y="130">Frame(t−1)</text>
  <text class="mono" x="36" y="148">Frame(t)</text>
  <text class="mono" x="36" y="166">telemetría</text>
  <path class="arrow" d="M170 128 L188 128" marker-end="url(#ah)" />

  <!-- 1 escala -->
  <rect class="card" x="190" y="80" width="170" height="96" rx="8" />
  <circle class="badge" cx="210" cy="104" r="11" /><text class="badge-t" x="210" y="108.5" text-anchor="middle">1</text>
  <text class="ttl" x="228" y="109">Escala</text>
  <text class="txt" x="204" y="138">grises, 640 px de ancho</text>
  <text class="txt" x="204" y="156">focal escalada</text>
  <path class="arrow" d="M360 128 L372 128" marker-end="url(#ah)" />

  <!-- 2 flujo -->
  <rect class="card" x="374" y="80" width="170" height="96" rx="8" />
  <circle class="badge" cx="394" cy="104" r="11" /><text class="badge-t" x="394" y="108.5" text-anchor="middle">2</text>
  <text class="ttl" x="412" y="109">Flujo óptico</text>
  <text class="txt" x="388" y="138">denso, con DIS (OpenCV)</text>
  <text class="txt" x="388" y="156">un vector por píxel</text>
  <path class="arrow" d="M544 128 L556 128" marker-end="url(#ah)" />

  <!-- 3 derotacion -->
  <rect class="card" x="558" y="80" width="170" height="96" rx="8" />
  <circle class="badge" cx="578" cy="104" r="11" /><text class="badge-t" x="578" y="108.5" text-anchor="middle">3</text>
  <text class="ttl" x="596" y="109">Derotación</text>
  <text class="txt" x="572" y="138">resta la rotación</text>
  <text class="txt" x="572" y="156">medida por la IMU</text>
  <path class="arrow" d="M728 128 L740 128" marker-end="url(#ah)" />

  <!-- 4 FOE -->
  <rect class="card" x="742" y="80" width="170" height="96" rx="8" />
  <circle class="badge" cx="762" cy="104" r="11" /><text class="badge-t" x="762" y="108.5" text-anchor="middle">4</text>
  <text class="ttl" x="780" y="109">Foco de expansión</text>
  <text class="txt" x="756" y="138">mínimos cuadrados</text>
  <text class="txt" x="756" y="156">con recorte de atípicos</text>
  <path class="arrow" d="M912 128 L924 128" marker-end="url(#ah)" />

  <!-- 5 TTC -->
  <rect class="card" x="926" y="80" width="170" height="96" rx="8" />
  <circle class="badge" cx="946" cy="104" r="11" /><text class="badge-t" x="946" y="108.5" text-anchor="middle">5</text>
  <text class="ttl" x="964" y="109">TTC y divergencia</text>
  <text class="txt" x="940" y="138">por píxel, agregados</text>
  <text class="txt" x="940" y="156">en una grilla de 3×3</text>
  <path class="arrow" d="M1096 128 L1112 128" marker-end="url(#ah)" />

  <!-- salida -->
  <rect class="out" x="1114" y="80" width="146" height="96" rx="8" />
  <text class="lab" x="1130" y="104">SALIDA</text>
  <text class="monoB" x="1130" y="134">ObstacleField</text>
  <text class="gray" x="1130" y="156">→ navigate</text>

  <!-- sin evidencia -->
  <path class="drop" d="M275 176 L275 214" />
  <path class="drop" d="M459 176 L459 214" />
  <path class="drop" d="M643 176 L643 214" />
  <path class="drop" d="M827 176 L827 214" />
  <rect class="none" x="190" y="214" width="906" height="48" rx="8" />
  <text class="gray" x="643" y="235" text-anchor="middle">sin evidencia suficiente: primer ciclo, modo degradado, rotación &gt; 2° entre frames, flujo bajo el piso de ruido</text>
  <text class="gray" x="643" y="252" text-anchor="middle">→ campo vacío con confianza 0, sin valores que enmascaren la falta de evidencia</text>
  <path class="drop" d="M1096 238 L1187 238 L1187 179" marker-end="url(#ahG)" />
</svg>
