<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 604" width="1200" height="604" font-family="Inter, 'Segoe UI', sans-serif">
  <!-- Pipeline de percepcion del lazo rapido. Fuente de informe/2026-1028 pipeline_percepcion.png -->
  <style>
    .bg   { fill: #FFFFFF; }
    .col  { fill: #F6F8FA; stroke: #E2E8F0; stroke-width: 1.2; }
    .card { fill: #FFFFFF; stroke: #0066CC; stroke-width: 1.6; }
    .frame { fill: #E6F2FF; stroke: #4A5568; stroke-width: 1.2; }
    .head { font-size: 13px; font-weight: 800; letter-spacing: .06em; }
    .t-acc { fill: #0066CC; } .t-crit { fill: #DC2626; } .t-safe { fill: #259E5F; } .t-ink { fill: #2D3748; }
    .sub  { font-family: 'Noto Sans Mono', ui-monospace, monospace; font-size: 11px; fill: #718096; }
    .ttl  { font-size: 14px; font-weight: 700; fill: #1A202C; }
    .txt  { font-size: 12px; fill: #4A5568; }
    .bul  { font-size: 12.5px; fill: #4A5568; }
    .mono { font-family: 'Noto Sans Mono', ui-monospace, monospace; font-size: 12px; fill: #1A202C; }
    .badge { fill: #0066CC; } .badge-t { font-size: 12px; font-weight: 800; fill: #FFFFFF; }
    .vec  { stroke: #0066CC; stroke-width: 1.6; fill: none; }
    .vec2 { stroke: #718096; stroke-width: 1.4; fill: none; }
    .arrow { fill: none; stroke: #4A5568; stroke-width: 2; }
    .tick { font-family: 'Noto Sans Mono', ui-monospace, monospace; font-size: 11px; fill: #4A5568; }
    .cap  { font-size: 12px; font-weight: 600; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="8" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#4A5568" />
    </marker>
    <marker id="av" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#0066CC" />
    </marker>
    <marker id="ag" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#718096" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="604" />

  <text class="head t-acc" x="20" y="30">LAZO RÁPIDO · CADA CICLO DE 200 MS · SIN REDES NEURONALES</text>
  <text class="sub" x="20" y="50">airsim-loop/src/perception/flow_ttc.py · FlowTTCEstimator</text>

  <!-- 1 par de fotogramas -->
  <rect class="card" x="20" y="66" width="176" height="226" rx="8" />
  <circle class="badge" cx="42" cy="92" r="12" /><text class="badge-t" x="42" y="96.5" text-anchor="middle">1</text>
  <text class="ttl" x="60" y="97">Par de fotogramas</text>
  <rect class="frame" x="48" y="122" width="82" height="58" rx="3" />
  <rect class="frame" x="84" y="142" width="82" height="58" rx="3" />
  <text class="mono" x="56" y="138">t−1</text>
  <text class="mono" x="92" y="158">t</text>
  <text class="txt" x="32" y="236">RGB a 640 px de ancho</text>
  <text class="txt" x="32" y="254">más la actitud de la</text>
  <text class="txt" x="32" y="272">telemetría (φ, θ, ψ)</text>
  <line class="arrow" x1="198" y1="170" x2="214" y2="170" marker-end="url(#ah)" />

  <!-- 2 flujo optico -->
  <rect class="card" x="216" y="66" width="176" height="226" rx="8" />
  <circle class="badge" cx="238" cy="92" r="12" /><text class="badge-t" x="238" y="96.5" text-anchor="middle">2</text>
  <text class="ttl" x="256" y="97">Flujo óptico</text>
  <g>
    <line class="vec" x1="250" y1="130" x2="262" y2="124" marker-end="url(#av)" />
    <line class="vec" x1="290" y1="128" x2="300" y2="120" marker-end="url(#av)" />
    <line class="vec" x1="330" y1="130" x2="346" y2="122" marker-end="url(#av)" />
    <line class="vec" x1="250" y1="162" x2="262" y2="160" marker-end="url(#av)" />
    <line class="vec" x1="290" y1="160" x2="300" y2="158" marker-end="url(#av)" />
    <line class="vec" x1="330" y1="160" x2="348" y2="158" marker-end="url(#av)" />
    <line class="vec" x1="250" y1="194" x2="262" y2="198" marker-end="url(#av)" />
    <line class="vec" x1="290" y1="194" x2="300" y2="200" marker-end="url(#av)" />
    <line class="vec" x1="330" y1="194" x2="346" y2="202" marker-end="url(#av)" />
  </g>
  <text class="txt" x="228" y="236">denso, con DIS (OpenCV):</text>
  <text class="txt" x="228" y="254">un vector de movimiento</text>
  <text class="txt" x="228" y="272">por píxel</text>
  <line class="arrow" x1="394" y1="170" x2="410" y2="170" marker-end="url(#ah)" />

  <!-- 3 derotacion -->
  <rect class="card" x="412" y="66" width="176" height="226" rx="8" />
  <circle class="badge" cx="434" cy="92" r="12" /><text class="badge-t" x="434" y="96.5" text-anchor="middle">3</text>
  <text class="ttl" x="452" y="97">Derotación</text>
  <text class="mono" x="500" y="134" text-anchor="middle">flujo medido</text>
  <text class="mono" x="500" y="156" text-anchor="middle">− rotación (IMU)</text>
  <line x1="440" y1="168" x2="560" y2="168" stroke="#4A5568" stroke-width="1.2" />
  <text class="mono" x="500" y="188" text-anchor="middle" style="font-weight:700;fill:#0066CC">= traslación</text>
  <text class="txt" x="424" y="236">proyecta Δφ, Δθ, Δψ sobre</text>
  <text class="txt" x="424" y="254">el plano focal y lo resta:</text>
  <text class="txt" x="424" y="272">queda solo el avance</text>
  <line class="arrow" x1="590" y1="170" x2="606" y2="170" marker-end="url(#ah)" />

  <!-- 4 foco de expansion -->
  <rect class="card" x="608" y="66" width="176" height="226" rx="8" />
  <circle class="badge" cx="630" cy="92" r="12" /><text class="badge-t" x="630" y="96.5" text-anchor="middle">4</text>
  <text class="ttl" x="648" y="97">Foco de expansión</text>
  <g>
    <line class="vec" x1="690" y1="148" x2="660" y2="124" marker-end="url(#av)" />
    <line class="vec" x1="696" y1="146" x2="696" y2="118" marker-end="url(#av)" />
    <line class="vec" x1="702" y1="148" x2="736" y2="124" marker-end="url(#av)" />
    <line class="vec" x1="688" y1="156" x2="650" y2="156" marker-end="url(#av)" />
    <line class="vec" x1="704" y1="156" x2="748" y2="156" marker-end="url(#av)" />
    <line class="vec" x1="690" y1="164" x2="656" y2="194" marker-end="url(#av)" />
    <line class="vec" x1="696" y1="166" x2="696" y2="202" marker-end="url(#av)" />
    <line class="vec" x1="702" y1="164" x2="742" y2="196" marker-end="url(#av)" />
    <circle cx="696" cy="156" r="5" fill="none" stroke="#DC2626" stroke-width="2" />
    <text class="mono" x="696" y="217" text-anchor="middle" style="fill:#DC2626;font-size:10.5px">FOE</text>
  </g>
  <text class="txt" x="620" y="236">punto de fuga del avance:</text>
  <text class="txt" x="620" y="254">mínimos cuadrados con</text>
  <text class="txt" x="620" y="272">recorte de atípicos</text>
  <line class="arrow" x1="786" y1="170" x2="802" y2="170" marker-end="url(#ah)" />

  <!-- 5 TTC -->
  <rect class="card" x="804" y="66" width="176" height="226" rx="8" />
  <circle class="badge" cx="826" cy="92" r="12" /><text class="badge-t" x="826" y="96.5" text-anchor="middle">5</text>
  <text class="ttl" x="844" y="97">TTC por píxel</text>
  <text class="mono" x="892" y="134" text-anchor="middle">TTC(p) =</text>
  <text class="mono" x="892" y="160" text-anchor="middle">‖p − FOE‖ · Δt</text>
  <line x1="828" y1="168" x2="956" y2="168" stroke="#4A5568" stroke-width="1.2" />
  <text class="mono" x="892" y="186" text-anchor="middle">‖v_tras(p)‖</text>
  <text class="txt" x="816" y="236">lo que se expande rápido</text>
  <text class="txt" x="816" y="254">está cerca: tiempo a</text>
  <text class="txt" x="816" y="272">colisión en segundos</text>
  <line class="arrow" x1="982" y1="170" x2="998" y2="170" marker-end="url(#ah)" />

  <!-- 6 ObstacleField -->
  <rect class="card" x="1000" y="66" width="176" height="226" rx="8" />
  <circle class="badge" cx="1022" cy="92" r="12" /><text class="badge-t" x="1022" y="96.5" text-anchor="middle">6</text>
  <text class="ttl" x="1040" y="97">ObstacleField</text>
  <g>
    <rect x="1046" y="116" width="26" height="26" rx="3" fill="#E3F6EC" stroke="#259E5F" />
    <rect x="1075" y="116" width="26" height="26" rx="3" fill="#E3F6EC" stroke="#259E5F" />
    <rect x="1104" y="116" width="26" height="26" rx="3" fill="#E3F6EC" stroke="#259E5F" />
    <rect x="1046" y="145" width="26" height="26" rx="3" fill="#FDF3DF" stroke="#D97706" />
    <rect x="1075" y="145" width="26" height="26" rx="3" fill="#FDE4E4" stroke="#DC2626" />
    <rect x="1104" y="145" width="26" height="26" rx="3" fill="#E3F6EC" stroke="#259E5F" />
    <rect x="1046" y="174" width="26" height="26" rx="3" fill="#E3F6EC" stroke="#259E5F" />
    <rect x="1075" y="174" width="26" height="26" rx="3" fill="#FDF3DF" stroke="#D97706" />
    <rect x="1104" y="174" width="26" height="26" rx="3" fill="#E3F6EC" stroke="#259E5F" />
    <text class="mono" x="1088" y="162" text-anchor="middle" style="font-size:10px;fill:#DC2626">2.4</text>
  </g>
  <text class="txt" x="1012" y="236">grilla 3×3: ocupación,</text>
  <text class="txt" x="1012" y="254">TTC, divergencia y</text>
  <text class="txt" x="1012" y="272">confianza → navigate</text>

  <!-- umbrales -->
  <rect class="col" x="20" y="310" width="1156" height="118" rx="10" />
  <text class="head t-ink" x="38" y="336">UMBRALES · ROC CONTRA PROFUNDIDAD DE REFERENCIA (ÍNDICE DE YOUDEN)</text>
  <rect x="60" y="350" width="432" height="18" fill="#DC2626" rx="3" />
  <rect x="492" y="350" width="189" height="18" fill="#D97706" />
  <rect x="681" y="350" width="459" height="18" fill="#259E5F" rx="3" />
  <text class="tick" x="60" y="386">0 s</text>
  <text class="tick" x="492" y="386" text-anchor="middle">3.2 s</text>
  <text class="tick" x="681" y="386" text-anchor="middle">4.6 s</text>
  <text class="tick" x="1140" y="386" text-anchor="end">∞</text>
  <text class="cap t-crit" x="276" y="412" text-anchor="middle">peligro frontal (τ = 2 s, AUC 0.97) → evadir o GIRAR_90</text>
  <text class="cap" x="586" y="412" text-anchor="middle" style="fill:#B45309">advertencia (τ = 3 s, AUC 0.96)</text>
  <text class="cap t-safe" x="910" y="412" text-anchor="middle">despejado o sin evidencia → guiado nominal</text>

  <!-- puntos ciegos -->
  <rect class="col" x="20" y="444" width="570" height="146" rx="10" />
  <text class="head t-crit" x="38" y="470">PUNTOS CIEGOS DEL FLUJO</text>
  <text class="bul" x="38" y="496">• Sin traslación (hover, giro en el lugar, FRENAR): no hay evidencia</text>
  <text class="bul" x="38" y="520">• Obstáculo centrado en el foco de expansión: su flujo se anula</text>
  <text class="bul" x="38" y="544">• Estructuras finas (mallas, cables): casi no generan divergencia</text>
  <text class="bul" x="38" y="568">• Debajo de 4.5 m, el suelo en movimiento produce TTC falsos</text>

  <rect class="col" x="606" y="444" width="570" height="146" rx="10" />
  <text class="head t-safe" x="624" y="470">CÓMO SE CUBREN</text>
  <text class="bul" x="624" y="496">• StallDetector: contacto IMU y muro ciego (regla 4), atasco (regla 2)</text>
  <text class="bul" x="624" y="520">• Profundidad estimada en el lazo lento (Depth Anything V2): sale</text>
  <text class="bul" x="636" y="538">del mismo RGB y no necesita traslación (~110 ms, AUC 0.83–0.87)</text>
  <text class="bul" x="624" y="568">• Piso óptico: debajo de 4.5 m, guiado sin evasión por flujo (regla 5)</text>
</svg>
