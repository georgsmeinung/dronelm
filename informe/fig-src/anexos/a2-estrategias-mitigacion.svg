<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Inter, 'Segoe UI', sans-serif">
  <!-- A2.4: salvaguardas contra las alucinaciones del VLM -->

  <style>
    .bg { fill: #FFFFFF; }
    .panel { fill: #F6F8FA; stroke: #E2E8F0; stroke-width: 1.2; }
    .card { fill: #FFFFFF; stroke: #CBD5E0; stroke-width: 1.4; }
    .card-acc { fill: #FFFFFF; stroke: #0066CC; stroke-width: 1.8; }
    .card-blue { fill: #E6F2FF; stroke: #0066CC; stroke-width: 1.8; }
    .card-green { fill: #EAF7EF; stroke: #259E5F; stroke-width: 1.8; }
    .card-warn { fill: #FFF7E6; stroke: #D97706; stroke-width: 1.8; }
    .card-red { fill: #FDECEC; stroke: #DC2626; stroke-width: 1.8; }
    .card-gray { fill: #F1F3F5; stroke: #A0AEC0; stroke-width: 1.4; stroke-dasharray: 6 4; }
    .head { font-size: 14px; font-weight: 800; letter-spacing: .05em; fill: #0066CC; }
    .head-ink { font-size: 14px; font-weight: 800; letter-spacing: .05em; fill: #2D3748; }
    .title { font-size: 22px; font-weight: 800; fill: #1A202C; }
    .ttl { font-size: 15px; font-weight: 700; fill: #1A202C; }
    .txt { font-size: 13px; fill: #4A5568; }
    .txt-b { font-size: 13px; font-weight: 700; fill: #2D3748; }
    .small { font-size: 11.5px; fill: #718096; }
    .mono { font-family: 'Noto Sans Mono', ui-monospace, monospace; font-size: 12px; fill: #1A202C; }
    .mono-s { font-family: 'Noto Sans Mono', ui-monospace, monospace; font-size: 11px; fill: #4A5568; }
    .math { font-family: 'Cambria Math', 'STIX Two Math', 'Times New Roman', serif; font-size: 17px; fill: #1A202C; }
    .math-s { font-family: 'Cambria Math', 'STIX Two Math', 'Times New Roman', serif; font-size: 14px; fill: #1A202C; }
    .acc { fill: #0066CC; } .safe { fill: #259E5F; } .warn { fill: #B45309; } .crit { fill: #DC2626; }
    .ln { stroke: #4A5568; stroke-width: 1.8; fill: none; }
    .ln-acc { stroke: #0066CC; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #718096; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
    .grid { stroke: #2D3748; stroke-width: 1.2; fill: none; }
    .badge { fill: #0066CC; } .badge-t { font-size: 13px; font-weight: 800; fill: #FFFFFF; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="8" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#4A5568" /></marker>
    <marker id="aa" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="8" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#0066CC" /></marker>
    <marker id="av" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#0066CC" /></marker>
    <marker id="ag" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#718096" /></marker>
    <marker id="ar" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#DC2626" /></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="640" />
  <text class="head" x="24" y="36" text-anchor="start" >SALVAGUARDAS DE LA ARQUITECTURA FRENTE A LAS ALUCINACIONES DEL VLM</text>
  <text class="small" x="24" y="56" text-anchor="start" >Anexo 2, IT.A2.4 · modelo de la tesis: LFM2.5-VL-1.6B Q4_K_M en Ollama, en la misma GPU que Unreal</text>
  <rect class="panel" x="24" y="76" width="1152" height="196" rx="10" />
  <text class="head-ink" x="44" y="102" text-anchor="start" >CAMINO DE UNA RESPUESTA DEL MODELO</text>
  <rect class="card" x="44" y="118" width="196" height="132" rx="8" />
  <text class="ttl" x="58" y="142" text-anchor="start" >Fotograma o mapa</text>
  <text class="txt" x="58" y="164" text-anchor="start" >grilla 3×3 sobre el fotograma,</text>
  <text class="txt" x="58" y="182" text-anchor="start" >imágenes de un barrido</text>
  <text class="txt" x="58" y="200" text-anchor="start" >o parche del mapa cenital</text>
  <path class="ln" d="M242 184 L266 184" marker-end="url(#ah)" />
  <rect class="card-blue" x="268" y="118" width="196" height="132" rx="8" />
  <text class="ttl" x="282" y="142" text-anchor="start" >VLM + json_schema</text>
  <text class="txt" x="282" y="164" text-anchor="start" >los tokens que violan el</text>
  <text class="txt" x="282" y="182" text-anchor="start" >esquema se enmascaran:</text>
  <text class="txt" x="282" y="200" text-anchor="start" >la salida siempre es válida</text>
  <path class="ln" d="M466 184 L490 184" marker-end="url(#ah)" />
  <rect class="card-blue" x="492" y="118" width="196" height="132" rx="8" />
  <text class="ttl" x="506" y="142" text-anchor="start" >Enumeración cerrada</text>
  <text class="txt" x="506" y="164" text-anchor="start" >free / blocked por sector,</text>
  <text class="txt" x="506" y="182" text-anchor="start" >view + free por imagen,</text>
  <text class="txt" x="506" y="200" text-anchor="start" >5 clases de terreno</text>
  <path class="ln" d="M690 184 L714 184" marker-end="url(#ah)" />
  <rect class="card-warn" x="716" y="118" width="196" height="132" rx="8" />
  <text class="ttl" x="730" y="142" text-anchor="start" >Parser estricto</text>
  <text class="txt" x="730" y="164" text-anchor="start" >valida el formato del modo;</text>
  <text class="txt" x="730" y="182" text-anchor="start" >si no coincide: no_parseable,</text>
  <text class="txt" x="730" y="200" text-anchor="start" >ninguna acción por defecto</text>
  <path class="ln" d="M914 184 L938 184" marker-end="url(#ah)" />
  <rect class="card-green" x="940" y="118" width="196" height="132" rx="8" />
  <text class="ttl" x="954" y="142" text-anchor="start" >El código decide</text>
  <text class="txt" x="954" y="164" text-anchor="start" >sub-meta en coordenadas</text>
  <text class="txt" x="954" y="182" text-anchor="start" >del mundo o puntaje de ruta;</text>
  <text class="txt" x="954" y="200" text-anchor="start" >el modelo no da velocidades</text>
  <rect class="card-acc" x="24" y="292" width="276" height="166" rx="8" />
  <circle class="badge" cx="50" cy="318" r="12" />
  <text class="badge-t" x="50" y="322.5" text-anchor="middle" >1</text>
  <text class="ttl" x="70" y="323" text-anchor="start" >Gramática en los logits</text>
  <text class="txt" x="40" y="354" text-anchor="start" >Se enmascaran los tokens que</text>
  <text class="txt" x="40" y="374" text-anchor="start" >violan el esquema JSON: el 100 %</text>
  <text class="txt" x="40" y="394" text-anchor="start" >de las respuestas tiene formato</text>
  <text class="txt" x="40" y="414" text-anchor="start" >válido (IT.8.2.1).</text>
  <rect class="card-acc" x="316" y="292" width="276" height="166" rx="8" />
  <circle class="badge" cx="342" cy="318" r="12" />
  <text class="badge-t" x="342" y="322.5" text-anchor="middle" >2</text>
  <text class="ttl" x="362" y="323" text-anchor="start" >Describir, no decidir</text>
  <text class="txt" x="332" y="354" text-anchor="start" >Respuestas en enumeraciones</text>
  <text class="txt" x="332" y="374" text-anchor="start" >cerradas; la geometría y la</text>
  <text class="txt" x="332" y="394" text-anchor="start" >cinemática son funciones</text>
  <text class="txt" x="332" y="414" text-anchor="start" >deterministas (IT.8.3, IT.8.4).</text>
  <rect class="card-acc" x="608" y="292" width="276" height="166" rx="8" />
  <circle class="badge" cx="634" cy="318" r="12" />
  <text class="badge-t" x="634" y="322.5" text-anchor="middle" >3</text>
  <text class="ttl" x="654" y="323" text-anchor="start" >Un solo lazo comanda</text>
  <text class="txt" x="624" y="354" text-anchor="start" >Solo el lazo rápido comanda</text>
  <text class="txt" x="624" y="374" text-anchor="start" >velocidades; una respuesta</text>
  <text class="txt" x="624" y="394" text-anchor="start" >inválida, tardía u obsoleta</text>
  <text class="txt" x="624" y="414" text-anchor="start" >se descarta (IT.5.1.2).</text>
  <rect class="card-acc" x="900" y="292" width="276" height="166" rx="8" />
  <circle class="badge" cx="926" cy="318" r="12" />
  <text class="badge-t" x="926" y="322.5" text-anchor="middle" >4</text>
  <text class="ttl" x="946" y="323" text-anchor="start" >Medir antes de confiar</text>
  <text class="txt" x="916" y="354" text-anchor="start" >Cada pregunta se mide contra</text>
  <text class="txt" x="916" y="374" text-anchor="start" >etiquetas de referencia antes</text>
  <text class="txt" x="916" y="394" text-anchor="start" >del vuelo; la que no pasa el</text>
  <text class="txt" x="916" y="414" text-anchor="start" >criterio no vuela (IT.10.13).</text>
  <rect class="card-gray" x="24" y="478" width="1152" height="140" rx="10" />
  <text class="head-ink" x="44" y="506" text-anchor="start" >RESULTADO DE LA SALVAGUARDA 4 EN ESTA TESIS</text>
  <circle cx="47" cy="530" r="2.4" fill="#0066CC" />
  <text class="txt" x="56" y="534" text-anchor="start" >Banco a bordo: la grilla del VLM separa sectores libres de bloqueados con AUC 0.53; ninguna de las ocho preguntas pasa el criterio (IT.11.0).</text>
  <circle cx="47" cy="551" r="2.4" fill="#0066CC" />
  <text class="txt" x="56" y="555" text-anchor="start" >La misma pregunta la responde una red de profundidad monocular (Depth Anything V2, AUC 0.83–0.87): es la fuente del lazo lento en vuelo.</text>
  <circle cx="47" cy="572" r="2.4" fill="#0066CC" />
  <text class="txt" x="56" y="576" text-anchor="start" >El VLM queda en el plan de ruta sobre el mapa cenital, antes del despegue, donde sí aporta señal (AUC 0.81).</text>
  <circle cx="47" cy="593" r="2.4" fill="#0066CC" />
  <text class="txt" x="56" y="597" text-anchor="start" >Ninguna salvaguarda hace que el modelo discrimine: solo evitan que una respuesta errónea se convierta en una maniobra.</text>
</svg>
