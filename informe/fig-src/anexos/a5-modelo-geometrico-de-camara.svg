<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Inter, 'Segoe UI', sans-serif">
  <!-- A5.1: modelo pin-hole de la camara frontal -->

  <style>
    .bg { fill: #FFFFFF; }
    .panel { fill: #F6F8FA; stroke: #E2E8F0; stroke-width: 1.2; }
    .card { fill: #FFFFFF; stroke: #CBD5E0; stroke-width: 1.4; }
    .card-acc { fill: #FFFFFF; stroke: #0066CC; stroke-width: 1.8; }
    .card-blue { fill: #E6F2FF; stroke: #0066CC; stroke-width: 1.8; }
    .card-green { fill: #EAF7EF; stroke: #259E5F; stroke-width: 1.8; }
    .card-warn { fill: #FFF7E6; stroke: #D97706; stroke-width: 1.8; }
    .card-red { fill: #FDECEC; stroke: #DC2626; stroke-width: 1.8; }
    .card-gray { fill: #F1F3F5; stroke: #A0AEC0; stroke-width: 1.4; stroke-dasharray: 6 4; }
    .head { font-size: 14px; font-weight: 800; letter-spacing: .05em; fill: #0066CC; }
    .head-ink { font-size: 14px; font-weight: 800; letter-spacing: .05em; fill: #2D3748; }
    .title { font-size: 22px; font-weight: 800; fill: #1A202C; }
    .ttl { font-size: 15px; font-weight: 700; fill: #1A202C; }
    .txt { font-size: 13px; fill: #4A5568; }
    .txt-b { font-size: 13px; font-weight: 700; fill: #2D3748; }
    .small { font-size: 11.5px; fill: #718096; }
    .mono { font-family: 'Noto Sans Mono', ui-monospace, monospace; font-size: 12px; fill: #1A202C; }
    .mono-s { font-family: 'Noto Sans Mono', ui-monospace, monospace; font-size: 11px; fill: #4A5568; }
    .math { font-family: 'Cambria Math', 'STIX Two Math', 'Times New Roman', serif; font-size: 17px; fill: #1A202C; }
    .math-s { font-family: 'Cambria Math', 'STIX Two Math', 'Times New Roman', serif; font-size: 14px; fill: #1A202C; }
    .acc { fill: #0066CC; } .safe { fill: #259E5F; } .warn { fill: #B45309; } .crit { fill: #DC2626; }
    .ln { stroke: #4A5568; stroke-width: 1.8; fill: none; }
    .ln-acc { stroke: #0066CC; stroke-width: 1.8; fill: none; }
    .ln-dash { stroke: #718096; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
    .grid { stroke: #2D3748; stroke-width: 1.2; fill: none; }
    .badge { fill: #0066CC; } .badge-t { font-size: 13px; font-weight: 800; fill: #FFFFFF; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="8" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#4A5568" /></marker>
    <marker id="aa" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="8" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#0066CC" /></marker>
    <marker id="av" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#0066CC" /></marker>
    <marker id="ag" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#718096" /></marker>
    <marker id="ar" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#DC2626" /></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="600" />
  <text class="head" x="24" y="36" text-anchor="start" >MODELO DE CÁMARA ESTENOPEICA (PIN-HOLE) DE LA CÁMARA FRONTAL</text>
  <text class="small" x="24" y="56" text-anchor="start" >Anexo 5, IT.A5.1 · ejes de la cámara: X a la derecha, Y hacia abajo, Z hacia adelante</text>
  <rect class="panel" x="24" y="76" width="620" height="500" rx="10" />
  <text class="head-ink" x="44" y="104" text-anchor="start" >PROYECCIÓN EN PERSPECTIVA (VISTA LATERAL)</text>
  <circle cx="100" cy="330" r="6" fill="#1A202C" />
  <text class="small" x="100" y="358" text-anchor="middle" >centro óptico</text>
  <path class="ln" d="M100 330 L610 330" marker-end="url(#ah)" />
  <text class="math" x="612" y="322" text-anchor="end" >Z</text>
  <path class="ln" d="M100 330 L100 500" marker-end="url(#ah)" />
  <text class="txt" x="110" y="508" text-anchor="start" >Y (abajo)</text>
  <line x1="260" y1="150" x2="260" y2="520" stroke="#0066CC" stroke-width="2.2" />
  <text class="txt" x="266" y="146" text-anchor="start" >plano de imagen</text>
  <line x1="100" y1="390" x2="260" y2="390" class="ln-dash" />
  <text class="txt" x="180.0" y="408" text-anchor="middle" >f (distancia focal)</text>
  <circle cx="560" cy="180" r="7" fill="#D97706" />
  <text class="math-s" x="554" y="166" text-anchor="end" >P = (X, Y, Z)</text>
  <line x1="100" y1="330" x2="560" y2="180" stroke="#D97706" stroke-width="1.6" />
  <circle cx="260" cy="277.8" r="5" fill="#D97706" />
  <text class="math-s" x="270" y="295.82608695652175" text-anchor="start" >p = (u, v)</text>
  <line x1="560" y1="180" x2="560" y2="330" class="ln-dash" />
  <text class="math-s" x="568" y="255.0" text-anchor="start" >−Y</text>
  <text class="txt" x="330" y="560" text-anchor="middle" >y = f · Y / Z : la escala Z se pierde en la proyección</text>
  <rect class="panel" x="664" y="76" width="512" height="500" rx="10" />
  <text class="head-ink" x="684" y="104" text-anchor="start" >DE LA ESCENA AL PÍXEL</text>
  <text class="math" x="800" y="152" text-anchor="middle" >u = f<tspan baseline-shift="sub" font-size="72%">x</tspan> · X / Z + c<tspan baseline-shift="sub" font-size="72%">x</tspan></text>
  <text class="math" x="1040" y="152" text-anchor="middle" >v = f<tspan baseline-shift="sub" font-size="72%">y</tspan> · Y / Z + c<tspan baseline-shift="sub" font-size="72%">y</tspan></text>
  <text class="txt" x="684" y="206" text-anchor="start" >en forma matricial, con la matriz intrínseca K:</text>
  <text class="math" x="700" y="290" text-anchor="start" >Z</text>
  <text class="math" x="716" y="290" text-anchor="start" >·</text>
  <path d="M736 240 H730 V334 H736" class="ln" />
  <path d="M768 240 H774 V334 H768" class="ln" />
  <text class="math" x="752.0" y="262" text-anchor="middle" >u</text>
  <text class="math" x="752.0" y="292" text-anchor="middle" >v</text>
  <text class="math" x="752.0" y="322" text-anchor="middle" >1</text>
  <text class="math" x="792" y="292" text-anchor="middle" >=</text>
  <path d="M814 240 H808 V334 H814" class="ln" />
  <path d="M970 240 H976 V334 H970" class="ln" />
  <text class="math" x="836.0" y="262" text-anchor="middle" >f<tspan baseline-shift="sub" font-size="72%">x</tspan></text>
  <text class="math" x="892.0" y="262" text-anchor="middle" >0</text>
  <text class="math" x="948.0" y="262" text-anchor="middle" >c<tspan baseline-shift="sub" font-size="72%">x</tspan></text>
  <text class="math" x="836.0" y="292" text-anchor="middle" >0</text>
  <text class="math" x="892.0" y="292" text-anchor="middle" >f<tspan baseline-shift="sub" font-size="72%">y</tspan></text>
  <text class="math" x="948.0" y="292" text-anchor="middle" >c<tspan baseline-shift="sub" font-size="72%">y</tspan></text>
  <text class="math" x="836.0" y="322" text-anchor="middle" >0</text>
  <text class="math" x="892.0" y="322" text-anchor="middle" >0</text>
  <text class="math" x="948.0" y="322" text-anchor="middle" >1</text>
  <path d="M992 240 H986 V334 H992" class="ln" />
  <path d="M1024 240 H1030 V334 H1024" class="ln" />
  <text class="math" x="1008.0" y="262" text-anchor="middle" >X</text>
  <text class="math" x="1008.0" y="292" text-anchor="middle" >Y</text>
  <text class="math" x="1008.0" y="322" text-anchor="middle" >Z</text>
  <text class="head-ink" x="684" y="380" text-anchor="start" >PARÁMETROS DE VUELO</text>
  <text class="txt" x="684" y="410" text-anchor="start" >cámara: 1080 × 720 px, campo horizontal de 90°</text>
  <text class="txt" x="684" y="432" text-anchor="start" >f<tspan baseline-shift="sub" font-size="72%">x</tspan> = W / (2 tan 45°) = 540 px; el código usa 554 px (CAMERA_FX)</text>
  <text class="txt" x="684" y="454" text-anchor="start" >c<tspan baseline-shift="sub" font-size="72%">x</tspan> = 540 px, c<tspan baseline-shift="sub" font-size="72%">y</tspan> = 360 px (centro de la imagen)</text>
  <text class="txt" x="684" y="476" text-anchor="start" >el flujo óptico corre a 640 px de ancho (FLOW_DOWNSCALE_WIDTH):</text>
  <text class="txt" x="684" y="498" text-anchor="start" >f y c se escalan por s = 640 / 1080 ≈ 0.59</text>
</svg>
